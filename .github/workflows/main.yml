name: CI

# Builds the JWatch firmware (app + recovery, with DFU packages) in the same Docker image the
# upstream InfiniTime CI uses, so pushes and pull requests get a real "does it still compile" check.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'doc/**'
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'doc/**'
      - '**.md'

jobs:
  build-firmware:
    runs-on: ubuntu-22.04
    container:
      image: infinitime/infinitime-build
    env:
      # Sources are checked out into the current directory (overrides the path in /opt/build.sh).
      SOURCES_DIR: .
    steps:
      - name: Checkout source files
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # /opt/build.sh's final step copies an external-resources zip that JWatch doesn't produce.
          # Everything before it has already built and been copied, so tolerate that one failure and
          # check for the real outputs explicitly below.
          /opt/build.sh all || echo "build.sh exited non-zero (expected: no resources zip) - checking outputs"
          ls -la build/output
          ls build/output/pinetime-mcuboot-app-dfu-*.zip

      - name: Report size
        shell: bash
        run: |
          . /opt/build.sh
          .github/workflows/getSize.sh "$BUILD_DIR"/src/pinetime-app-*.out

      - name: Set ref name (slashes to dashes)
        shell: bash
        env:
          ref_name: ${{ github.head_ref || github.ref_name }}
        run: echo "REF_NAME=${ref_name//\//-}" >> $GITHUB_ENV

      - name: Upload DFU packages
        uses: actions/upload-artifact@v4
        with:
          name: JWatch DFU ${{ env.REF_NAME }}
          path: build/output/*dfu*.zip
